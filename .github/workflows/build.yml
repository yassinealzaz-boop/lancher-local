name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source code
        run: |
          wget https://github.com/yassinealzaz-boop/lancher-local/raw/main/launcher-vocal.zip -O project.zip || true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: echo "Ready to build"
